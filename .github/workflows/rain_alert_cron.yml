name: Scheduled Rain Alert Check

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Rain Alert Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node tools/check_rain_alerts.js
