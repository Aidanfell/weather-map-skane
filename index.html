<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skåne & Blekinge High-Precision Weather Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Top Floating Header & Layer Quick-Switch -->
<header id="top-bar">
  <div class="brand">
    <div class="radar-dot"></div>
    <h1>Skåne & Blekinge Weather</h1>
  </div>
  <nav id="quick-layers">
    <button class="layer-pill active" data-layer="precip">
      <span class="icon">🌧️</span> Rain Radar
    </button>
    <button class="layer-pill" data-layer="clouds">
      <span class="icon">☁️</span> Cloud Cover
    </button>
    <button class="layer-pill" data-layer="wind">
      <span class="icon">💨</span> Wind Flow
    </button>
    <button class="layer-pill" data-layer="temp">
      <span class="icon">🌡️</span> Temperature
    </button>
  </nav>
</header>

<!-- Collapsible Settings Panel -->
<div id="layer-panel" class="panel collapsed">
  <div class="panel-header" id="toggle-layer-panel">
    <h2>Layer Controls & Opacity</h2>
    <span class="chevron">▾</span>
  </div>
  <div class="panel-content">
    <div id="layer-rows"></div>
    <div id="legend"></div>
  </div>
</div>

<!-- Weather Inspector Widget -->
<div id="readout" class="panel">
  <div class="readout-header">
    <span class="location-name" id="readout-location">Skåne Forecast</span>
    <span class="time-stamp" id="readout-time">Live</span>
  </div>
  <div id="readout-body">
    <div class="inspect-placeholder">Hover or tap map to inspect forecast</div>
  </div>
</div>

<!-- Timeline & Forecast Scrubber -->
<div id="timeline-container">
  <div id="day-selector"></div>
  
  <div id="time-bar" class="panel">
    <button id="play-btn" title="Play / Pause Animation">
      <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    
    <div class="slider-wrapper">
      <canvas id="precip-histogram" height="28"></canvas>
      <input type="range" id="time-slider" min="0" max="0" value="0" step="1">
    </div>
    
    <div class="time-display">
      <span id="time-label">–</span>
      <button id="speed-btn" title="Cycle playback speed">1x</button>
    </div>
  </div>
</div>

<!-- Loading & Error Overlays -->
<div id="loading">
  <div class="pulse-ring"></div>
  <p>Fetching High-Res Weather Data…</p>
</div>
<div id="error-banner" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="land.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
